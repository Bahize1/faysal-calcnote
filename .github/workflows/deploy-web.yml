
name: Faysal CalcNote web

'on':
  workflow_dispatch:
  push:
    paths:
      - 'web.zip'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract web.zip
        run: |
          set -e
          test -f web.zip
          mkdir web-dist
          unzip -o web.zip -d web-dist
          FILE="$(find web-dist -type f -name index.html -print -quit)"
          if [ -z "$FILE" ]; then
            echo "Erreur : aucun index.html trouvé dans web.zip"
            exit 1
          fi
          echo "SITE_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Prepare website
        run: |
          set -e
          mkdir public
          cp -R "$SITE_DIR"/. public/
          test -f public/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        uses: actions/deploy-pages@v4
