name: APK v4
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser le zip Android le plus récent
        run: unzip -o "$(ls -t Faysal-CalcNote-android*.zip | head -1)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Versions utilisées
        run: node --version && java -version
      - run: npm install
      - run: npm run fonts
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Compiler l'APK de test
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Faysal-CalcNote-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
