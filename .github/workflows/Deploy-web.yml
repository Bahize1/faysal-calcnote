name: Deploy Faysal CalcNote Web

on:
workflow_dispatch:
push:
paths:
- "web.zip"
- ".github/workflows/deploy-web.yml"

permissions:
contents: read
pages: write
id-token: write

jobs:
deploy:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Extract web.zip
    run: |
      test -f web.zip
      mkdir web-dist
      unzip -o web.zip -d web-dist
      test -n "$(find web-dist -name index.html -type f -print -quit)"

  - name: Prepare website
    run: |
      FILE="$(find web-dist -name index.html -type f -print -quit)"
      DIR="$(dirname "$FILE")"
      mkdir public
      cp -R "$DIR"/. public/

  - name: Configure Pages
    uses: actions/configure-pages@v5

  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: public

  - name: Deploy
    uses: actions/deploy-pages@v4
