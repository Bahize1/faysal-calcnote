
name: APK signe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Decompresser le projet
        shell: bash
        run: |
          f=$(ls Faysal-CalcNote-android-v*.zip 2>/dev/null | sort -V | tail -1)
          [ -z "$f" ] && f=Faysal-CalcNote-android.zip
          echo "Projet : $f"
          unzip -o "$f"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dependances
        run: npm install

      - name: Generer les polices
        run: npm run fonts

      - name: Ajouter Android
        run: npx cap add android

      - name: Generer les ressources Android
        run: npx capacitor-assets generate --android

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Mettre a jour Gradle
        shell: bash
        run: |
          sed -i 's/gradle-8\.2\.1-/gradle-8.6-/' \
            android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Preparer la cle de signature
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Erreur : secret KEYSTORE_B64 absent"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          test -s "$GITHUB_WORKSPACE/release.jks"

      - name: Activer la signature
        shell: bash
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_FILE"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "faysal"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Compiler
        env:
          KS_FILE: ${{ github.workspace }}/release.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --stop || true
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Publier les fichiers APK et AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Faysal-CalcNote-signe
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
