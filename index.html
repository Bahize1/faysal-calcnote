<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16241D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CalcNote">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Faysal CalcNote</title>

<link rel="stylesheet" href="fonts.css">
<style>
/* Plan : un bandeau-ticket sombre porte le total ; dessous, une carte de papier réglé par lot. Accueil, onglets et paramètres reprennent les mêmes jetons. */
:root{
  --bg:#E9EDE6; --paper:#F7F9F4; --ink:#16241D; --muted:#5A6A61; --line:#C8D1C6; --fg:var(--ink);
  --accent:#1B6B4A; --on-accent:#F7F9F4; --band:#16241D; --on-band:#E8F1EA; --band-accent:#8FE3BE; --warn:#B24A0C;
  --kp-bg:#E4EAE3; --kp-line:#C4CCC2; --kp-ink:#16241D; --key:#FFFFFF; --key-op:#E7ECE6; --key-ink:#16241D; --key-down:#D3DBD1;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --paper:#16211B; --ink:#E3ECE5; --muted:#8EA196; --line:#2A3A31;
    --accent:#62C99D; --on-accent:#0E1512; --band:#1C2B23; --on-band:#E8F1EA; --band-accent:#8FE3BE; --warn:#F2A365;
    --kp-bg:#101A15; --kp-line:#2A3A31; --kp-ink:#E3ECE5; --key:#EBF1EC; --key-op:#CDD8D0; --key-ink:#16241D; --key-down:#B5C3B8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --paper:#16211B; --ink:#E3ECE5; --muted:#8EA196; --line:#2A3A31;
  --accent:#62C99D; --on-accent:#0E1512; --band:#1C2B23; --on-band:#E8F1EA; --band-accent:#8FE3BE; --warn:#F2A365;
  --kp-bg:#101A15; --kp-line:#2A3A31; --kp-ink:#E3ECE5; --key:#EBF1EC; --key-op:#CDD8D0; --key-ink:#16241D; --key-down:#B5C3B8;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--f-body);padding-block:16px 48px;padding-inline:16px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html[dir="rtl"] .q,html[dir="rtl"] .ln-in{direction:ltr;text-align:left}
html[dir="rtl"] input[type="tel"],html[dir="rtl"] .decl input,html[dir="rtl"] .per input{direction:ltr}

/* Accueil */
.home-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.who-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.avatar{width:76px;height:76px;flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--band);color:var(--band-accent);border:2px solid var(--accent);font:800 30px/1 var(--f-display);letter-spacing:.04em}
.avatar.sm{width:56px;height:56px;font-size:22px}
.avatar img{display:block;width:100%;height:100%;object-fit:cover}
.hello{font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.home-name{margin:0;font:800 30px/1.05 var(--f-display);letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere;text-wrap:balance}
.brandline{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brandline h1{margin:0;font:800 20px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.brandline span{font:500 12px var(--f-mono);color:var(--muted)}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--fg);cursor:pointer}
.big-btn{min-height:54px;font-size:16px}
.sec{margin:0;font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.op-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.home-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;align-items:center;text-align:start;width:100%;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}
.hc-title{grid-column:1;font:700 17px/1.2 var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc-meta{grid-column:1;font:500 12px var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-total{grid-column:2;grid-row:1 / span 2;text-align:end;font:800 22px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.hc-amt{display:block;margin-top:4px;font:500 12px var(--f-mono);color:var(--muted)}

/* Barre d'onglets */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:8px;padding-block:4px 8px;background:var(--bg)}
.tabs{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;max-width:150px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font:600 13px var(--f-body);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tab.add{max-width:none;padding:0 16px;color:var(--accent);font:800 20px/1 var(--f-body)}

/* En-tête de l'opération */
.band{background:var(--band);color:var(--on-band);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font:800 22px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--band-accent)}
.brand span{font:500 12px var(--f-mono);letter-spacing:.04em;opacity:.7}
.title{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px dashed color-mix(in srgb,var(--on-band) 38%,transparent);border-radius:0;padding:4px 0;font:500 16px var(--f-body);color:var(--on-band)}
.trip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;align-items:end}
.fld.wide{grid-column:1 / -1}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.95}
.fld input{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px dashed color-mix(in srgb,var(--on-band) 38%,transparent);border-radius:0;padding:6px 0;font:500 15px var(--f-body);letter-spacing:0;text-transform:none;color:var(--on-band)}
.fld input::placeholder,.title::placeholder{color:color-mix(in srgb,var(--on-band) 50%,transparent)}
.cap{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.grand{display:flex;align-items:baseline;gap:10px;margin-top:-6px}
.grand .big{font:800 clamp(56px,17vw,96px)/.95 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.grand .unit{font:700 24px var(--f-display);color:var(--band-accent)}
.grand.sub{margin-top:0}
.grand.sub .big{font-size:clamp(34px,10vw,52px)}
.amount{font-weight:700;color:var(--ink)}
.gstats{display:flex;flex-wrap:wrap;gap:4px 18px;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.per{display:flex;align-items:center;gap:8px;font:500 12px var(--f-mono);margin-inline-end:auto}
.per input{width:56px;background:transparent;border:1px solid color-mix(in srgb,var(--on-band) 38%,transparent);border-radius:4px;padding:8px;text-align:center;font:500 14px var(--f-mono);color:var(--on-band)}

.btn{min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--fg);cursor:pointer;font:600 14px var(--f-body)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:color-mix(in srgb,var(--on-band) 38%,transparent);color:var(--on-band)}
.btn.armed{background:var(--warn);border-color:var(--warn);color:#fff}
.link{background:none;border:0;padding:10px 2px;min-height:44px;cursor:pointer;font:600 13px var(--f-body);color:var(--accent)}
.link.danger{color:var(--warn)}
.link.armed{text-decoration:underline}

.banner{border:1px dashed var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:space-between;font-size:14px;color:var(--muted)}
.banner p{margin:0;min-width:0;flex:1 1 220px}

/* Lots */
.lots{display:flex;flex-direction:column;gap:16px}
.lot{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 14px 4px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.lot-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.name{flex:1 1 12ch;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0;font:700 26px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.lot-total{display:flex;align-items:baseline;gap:6px;color:var(--accent)}
.lot-total .big{font:800 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.lot-total .unit{font:700 18px var(--f-display)}
.lot-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.decl{display:flex;align-items:center;gap:6px}
.decl input{width:9ch;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 2px;text-align:right;font:500 14px var(--f-mono);color:var(--ink)}
.pill{padding:3px 9px;border-radius:99px;font:600 12px var(--f-mono)}
.pill.ok{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.lines{border-top:0}
.lot-sum{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.ln{display:grid;grid-template-columns:2rem minmax(0,1fr) auto 36px;gap:8px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}
.plus{width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--accent);font:700 20px/1 var(--f-mono);cursor:pointer}
.cnt{font:500 12px/1.9 var(--f-mono);color:var(--muted);text-align:right}
.cnt.off{color:var(--warn);font-weight:700}
.ln-in{display:block;width:100%;min-width:0;padding:0;border:0;background:transparent;resize:none;overflow:hidden;font:400 14px/1.6 var(--f-mono);color:var(--ink)}
.ln-sum{min-width:5ch;text-align:right;font:700 15px/1.6 var(--f-mono);font-variant-numeric:tabular-nums}
.empty{margin:0;padding:12px 0;color:var(--muted);font-size:14px}
.entry{display:block}
.q{display:block;width:100%;min-width:0;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:500 20px var(--f-mono);font-variant-numeric:tabular-nums;cursor:pointer;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.q.empty::before{content:attr(data-ph);color:var(--muted);font:400 15px var(--f-body)}
.q.on{border-color:var(--accent)}
.q[data-res]::after{content:attr(data-res);display:block;text-align:right;color:var(--accent);font:700 14px var(--f-mono)}
.caret{display:inline-block;width:2px;height:1.15em;margin:0 1px;background:var(--accent);vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.caret{animation:none}.toast{transition:none}}
.lot-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:0 12px}
.add-lot{min-height:52px;border:1px dashed var(--accent);border-radius:6px;background:transparent;color:var(--accent);font:700 15px var(--f-body);cursor:pointer}

/* Fin d'opération */
.endops{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.act-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act-row .btn{min-height:50px}
.foot{display:flex;flex-wrap:wrap;gap:8px}
.recap{width:100%;min-height:160px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:400 13px/1.5 var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:4px;font:500 13px var(--f-body);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* Clavier intégré */
.kp{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--kp-bg);color:var(--kp-ink);border-top:1px solid var(--kp-line);padding-bottom:env(safe-area-inset-bottom,0px)}
.kp-in{max-width:720px;margin:0 auto}
.kp-top{display:flex;align-items:center;gap:12px;padding:4px 8px 4px 16px;font:500 13px var(--f-mono)}
.kp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.kp-tot{white-space:nowrap}
.kp-tot b{font:800 24px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.kp-hide{width:44px;height:40px;padding:0;border:0;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center}
.kp-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:52px;gap:1px;background:var(--kp-line);border-top:1px solid var(--kp-line)}
.kp-grid button{margin:0;padding:0;border:0;border-radius:0;background:var(--key);color:var(--key-ink);font:700 28px var(--f-display);cursor:pointer;touch-action:manipulation;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.kp-grid button:active{background:var(--key-down)}
.kp-grid .op{background:var(--key-op)}
.kp-grid .k-ad{grid-column:1 / -1;background:var(--accent);color:var(--on-accent);font:700 18px var(--f-body);display:flex;flex-direction:row;gap:10px;align-items:center;justify-content:center}
.kp-grid .k-ad:active{background:var(--accent);filter:brightness(.88)}
body.kp-on{padding-bottom:calc(340px + env(safe-area-inset-bottom,0px))}
body.kp-on .toast{bottom:calc(330px + env(safe-area-inset-bottom,0px))}

/* Paramètres */
.sheet{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--bg);color:var(--fg);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{margin:0;font:800 28px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.sbox{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.srow>span,.srow>label{flex:1 1 120px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font:600 14px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
input[type="color"]{width:56px;height:42px;padding:2px;border:1px solid var(--line);border-radius:4px;background:var(--paper);cursor:pointer}
input[type="range"]{flex:2 1 140px;min-width:0;accent-color:var(--accent)}
.txt-in{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font:500 16px var(--f-body)}
.fbox{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.fbox b{font:700 14px var(--f-body)}
.fbox output{min-width:4ch;text-align:end;font:600 13px var(--f-mono)}
.pv{display:flex;flex-direction:column;gap:10px}
.pv-kp{grid-template-columns:repeat(3,1fr)}

/* Impression */
#printSheet{display:none}
.ps-head{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
.ps-head h1{margin:0;font:800 20pt/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.ps-title{font:600 12pt var(--f-body);margin-top:4px}
.ps-meta{font:400 9.5pt/1.5 var(--f-body);text-align:end}
.ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-bottom:14px}
.ps-grid div{border-bottom:1px solid #777;padding-bottom:2px;min-height:12mm}
.ps-grid span{display:block;font:500 8pt var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:#444}
.ps-grid b{font:600 11pt var(--f-body)}
.ps-lot{break-inside:avoid;margin-bottom:12px}
.ps-lot h3{display:flex;justify-content:space-between;gap:12px;margin:0 0 2px;padding:4px 6px;background:#e6e6e6;font:700 12pt var(--f-body);text-transform:uppercase}
.ps-sub{font:400 9.5pt var(--f-body);margin:2px 0 4px;color:#222}
.ps-lines{width:100%;border-collapse:collapse;font:400 10pt var(--f-mono)}
.ps-lines td{border-bottom:1px solid #bbb;padding:2px 6px;vertical-align:top}
.ps-lines td:first-child,.ps-lines td:nth-child(3){width:8mm;color:#555}
.ps-lines td:last-child{text-align:end;width:22mm;font-weight:700}
.ps-total{display:flex;justify-content:space-between;gap:16px;border-top:2px solid #000;padding-top:6px;margin-top:6px;font:700 13pt var(--f-body)}
.ps-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.ps-sign div{border-top:1px solid #000;padding-top:3px;min-height:22mm;font:500 9pt var(--f-body);text-align:center}
@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff!important;color:#000!important}
  body{padding:0!important}
  body>*:not(#printSheet){display:none!important}
  #printSheet{display:block!important;color:#000;font:11pt/1.4 var(--f-body)}
}

.ob-hint{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.ob-err{margin:0;color:#B3261E;font-weight:600}

</style>
<div id="home" class="wrap">
  <div class="home-top">
    <div class="who">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div class="who-txt">
        <span class="hello" data-i18n="hello"></span>
        <h2 class="home-name" id="homeName"></h2>

  /* ---------- Calculs ---------- */
  function calc(seg){
    var s=seg.replace(/\s+/g,'').replace(/,/g,'.').replace(/[×*]/g,'*').replace(/[÷\/]/g,'/').replace(/[−–—]/g,'-');
    if(!/^[\d.*\/-]+$/.test(s)) return NaN;
    var tk=s.match(/\d+(?:\.\d+)?|[*\/-]/g)||[];
    if(tk.join('')!==s) return NaN;
    var i=0;
    function num(){var x=tk[i]; if(x===undefined||/^[*\/-]$/.test(x)) return NaN; i++; return parseFloat(x)}
    function term(){var v=num(); while(tk[i]==='*'||tk[i]==='/'){var o=tk[i++], w=num(); v=o==='*'?v*w:(w===0?NaN:v/w)} return v}
    var v=term(); while(tk[i]==='-'){i++; v-=term()}
    return i===tk.length?v:NaN;
  }
  function items(text){
    var out=[];
    String(text).split(/[+\n;]+/).forEach(function(seg){
      seg=seg.trim().replace(/(\d)\s*[xX]\s*(?=\d)/g,'$1*'); if(!seg) return;
      if(!/[×*÷\/−–—-]/.test(seg)){
        (seg.match(/\d+(?:[.,]\d+)?/g)||[]).forEach(function(m){out.push({t:m,v:parseFloat(m.replace(',','.'))})});
        return;
      }
      if(/\d\s+\d/.test(seg)) return;
      var v=calc(seg);
      if(isFinite(v)) out.push({t:seg.replace(/\s+/g,'').replace(/[*×]/g,' × ').replace(/[÷\/]/g,' ÷ ').replace(/[−–—-]/g,' − ').trim(),v:v});
    });
    return out;
  }

  var terms=function(x){return items(x).map(function(i){return i.t})};

  function press(k){
    var lotEl=kpAct&&lotsEl.querySelector('[data-lot="'+kpAct+'"]'); if(!lotEl) return;
    if(k==='hide') return closeKp();
    if(k==='add') return doAdd(lotEl);

    var e=entry(kpAct), v=e.v, p=Math.min(e.p,v.length), b=v.slice(0,p), a=v.slice(p);
    var tokB=/ [+×÷−] $/.test(b), tokA=/^ [+×÷−] /.test(a);
    if(k==='lf') e.p=p-(tokB?3:(p>0?1:0));
    else if(k==='rt') e.p=p+(tokA?3:(a?1:0));
    else if(k==='bk'){var n=tokB?3:(p>0?1:0); e.v=v.slice(0,p-n)+a; e.p=p-n}
    else if(OPS[k]){

    else if(a==='nophoto'){app.profile.photo=''; save(); renderHome(); refreshSettings()}
    else if(a==='export') saveBackup(true);
    else if(a==='import') $('#importFile').click();
    else if(a==='resetall'){app.set.colors={}; app.set.fonts=defaultFonts(); app.set.theme='auto'; applyStyle(); save(); refreshSettings()}
  });
  setEl.addEventListener('input',function(e){
    var el=e.target;
    if(el.id==='setName'){app.profile.name=el.value; save()}
    else if(el.id==='setPhone'){app.profile.phone=el.value; save()}
    else if(el.dataset.col){app.set.colors[el.dataset.col]=el.value; applyStyle(); save()}
    else if(el.dataset.fs){var k=el.dataset.fs; app.set.fonts[k].s=el.value/100; $('#fsv_'+k).textContent=el.value+'%'; applyStyle(); save()}
    else if(el.dataset.fc){app.set.fonts[el.dataset.fc].c=el.value; applyStyle(); save()}
  });
  setEl.addEventListener('change',function(e){
    var el=e.target, f=el.files&&el.files[0];
    if(el.id==='photoFile'&&f) readPhoto(f);
    else if(el.id==='importFile'&&f){importFile(f); el.value=''}
  });
  $('#openSet').addEventListener('click',openSettings);
  $('#openSet2').addEventListener('click',openSettings);
  $('#closeSet').addEventListener('click',closeSettings);
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if(!setEl.hidden) closeSettings(); else if(!kp.hidden) closeKp();
  });


  /* ---------- Première utilisation ---------- */
  var onbEl=$('#onb');
  function onbHTML(){
    var P=app.profile;
    return '<div class="sheet-in"><div class="sheet-head"><h2>'+esc(t('ob_title'))+'</h2></div>'+
      '<p class="ob-hint">'+esc(t('ob_hint'))+'</p>'+
      '<section class="sbox"><h3 class="sec">'+esc(t('st_lang'))+'</h3><div class="seg">'+LANGS.map(function(l){return '<button type="button" data-oblang="'+l+'" aria-pressed="'+(lang===l)+'">'+LANGNAME[l]+'</button>'}).join('')+'</div></section>'+
      '<section class="sbox"><label class="srow"><span style="flex:1 1 100%">'+esc(t('st_name'))+'</span><input class="txt-in" id="obName" autocomplete="name" value="'+esc(P.name)+'"></label>'+
      '<label class="srow"><span style="flex:1 1 100%">'+esc(t('st_phone'))+'</span><input class="txt-in" id="obPhone" type="tel" inputmode="tel" autocomplete="tel" value="'+esc(P.phone)+'"></label></section>'+
      '<p class="ob-err" id="obErr" hidden>'+esc(t('ob_need'))+'</p>'+
      '<button class="btn primary big-btn" type="button" id="obGo" style="width:100%;margin-top:6px">'+esc(t('ob_start'))+'</button></div>';
  }
  function openOnb(){closeKp(); onbEl.innerHTML=onbHTML(); onbEl.hidden=false; onbEl.scrollTop=0}
  onbEl.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.dataset.oblang){
      var n=$('#obName',onbEl), ph=$('#obPhone',onbEl);
      app.profile.name=n.value; app.profile.phone=ph.value;
      lang=b.dataset.oblang; app.set.lang=lang; save(); applyStatic(); renderHome(); renderTabs(); render(); onbEl.innerHTML=onbHTML();
    } else if(b.id==='obGo'){
      var nm=$('#obName',onbEl).value.trim(), tel=$('#obPhone',onbEl).value.trim();
      if(!nm){$('#obErr',onbEl).hidden=false; $('#obName',onbEl).focus(); return}
      app.profile.name=nm; app.profile.phone=tel; app.profile.onboarded=true;
      app.ops.forEach(function(o){ if(!o.weigher) o.weigher=nm; if(!o.weigherTel) o.weigherTel=tel });
      save(); onbEl.hidden=true; renderHome(); render(); renderTabs(); showView('home');
    }
  });

  /* ---------- Démarrage ---------- */
  window.addEventListener('resize',autosizeAll);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(autosizeAll);
  applyStatic(); applyStyle(); renderHome(); render(); renderTabs(); showView('home');
  if(!app.profile.onboarded) openOnb();

})();
</script>
